<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPlaylist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <span class="eyebrow">پلی‌لیست شخصی</span>
    <h1>MyPlaylist</h1>
  </header>

  <main class="stage">
    <div class="turntable">
      <div class="disc" id="disc">
        <img id="discCover" class="disc-cover" src="cover.jpg" alt="" onerror="this.style.display='none'">
        <div class="disc-center"></div>
      </div>
      <div class="tonearm" id="tonearm"></div>
    </div>

    <div class="now-playing">
      <span class="np-label">در حال پخش</span>
      <h2 id="npTitle">—</h2>
      <p id="npArtist">—</p>
    </div>
  </main>

  <section class="tracklist" id="tracklist" aria-label="لیست آهنگ‌ها"></section>

  <footer class="player-bar">
    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" class="seek" value="0" min="0" max="100" step="0.1">
      <span class="time" id="durTime">0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="shuffleBtn" title="پخش تصادفی" aria-label="پخش تصادفی">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 3h4v4h-2V6.41l-3.29 3.3-1.42-1.42L17.59 5H17V3zM3 5h5.5l7 14H21v2h-6.5l-7-14H3V5zm14 16v-2h.59l1.7-1.71 1.42 1.42L18.41 21H21v2h-4v-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="قبلی" aria-label="آهنگ قبلی">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="پخش" aria-label="پخش یا توقف">
        <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="بعدی" aria-label="آهنگ بعدی">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" title="تکرار" aria-label="حالت تکرار">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
  </footer>

</div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
